# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Database Configuration
spring:
  datasource:
    url: jdbc:h2:mem:timetable
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.example.timetable: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
